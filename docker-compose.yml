services:
    # Message Broker Infrastructure
    zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0
        container_name: dominium-zookeeper
        ports:
            - "2181:2181"
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
            ZOOKEEPER_MIN_SESSION_TIMEOUT: 2000
            ZOOKEEPER_MAX_SESSION_TIMEOUT: 10000
        networks:
            - dominium-network
        healthcheck:
            test: ["CMD", "nc", "-z", "localhost", "2181"]
            interval: 10s
            timeout: 5s
            retries: 5

    kafka:
        image: confluentinc/cp-kafka:7.4.0
        container_name: dominium-kafka
        depends_on:
            zookeeper:
                condition: service_healthy
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"
        networks:
            - dominium-network
        healthcheck:
            test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
            interval: 5s
            timeout: 10s
            retries: 15
            start_period: 20s

    # Blockchain Nodes (Mining)
    node-1:
        build:
            context: .
            dockerfile: Dockerfile.node
        container_name: dominium-node-1
        depends_on:
            kafka:
                condition: service_healthy
        ports:
            - "8082:8082"
        environment:
            NODE_ID: node-1
            P2P_BROKERS: kafka:9092
            MINE: "true"
            DIFFICULTY: "${DIFFICULTY}"
            ADMIN_PUB: "${ADMIN_PUBLIC_KEY}"
        volumes:
            - ./logs:/app/logs
        networks:
            - dominium-network

    node-2:
        build:
            context: .
            dockerfile: Dockerfile.node
        container_name: dominium-node-2
        depends_on:
            kafka:
                condition: service_healthy
        ports:
            - "8083:8083"
        entrypoint:
            [
                "sh",
                "-c",
                "sleep 20 && ./node -id node-2 -mine true -p2p kafka:9092",
            ]
        environment:
            NODE_ID: node-2
            P2P_BROKERS: kafka:9092
            MINE: "true"
            DIFFICULTY: "${DIFFICULTY}"
            ADMIN_PUB: "${ADMIN_PUBLIC_KEY}"
        volumes:
            - ./logs:/app/logs
        networks:
            - dominium-network

    node-3:
        build:
            context: .
            dockerfile: Dockerfile.node
        container_name: dominium-node-3
        depends_on:
            kafka:
                condition: service_healthy
        ports:
            - "8084:8084"
        command: sh -c "sleep 40 && ./node -id node-3 -mine true -p2p kafka:9092"
        environment:
            NODE_ID: node-3
            P2P_BROKERS: kafka:9092
            MINE: "true"
            DIFFICULTY: "${DIFFICULTY}"
            ADMIN_PUB: "${ADMIN_PUBLIC_KEY}"
        volumes:
            - ./logs:/app/logs
        networks:
            - dominium-network

    # API Gateway
    api-gateway:
        build:
            context: .
            dockerfile: Dockerfile.api
        container_name: dominium-api-gateway
        depends_on:
            kafka:
                condition: service_healthy
            node-1:
                condition: service_started
        ports:
            - "8085:8085"
        environment:
            API_PORT: "8085"
            API_ID: "api-gateway"
            P2P_BROKERS: "kafka:9092"
            ADMIN_KEY: "${ADMIN_PRIVATE_KEY}"
            ADMIN_PUB: "${ADMIN_PUBLIC_KEY}"
        volumes:
            - ./logs:/app/logs
        networks:
            - dominium-network

    # Web Visualizer
    visualizer:
        build:
            context: .
            dockerfile: Dockerfile.visualizer
        container_name: dominium-visualizer
        depends_on:
            api-gateway:
                condition: service_started
        ports:
            - "8080:8080"
        environment:
            API_URL: "http://api-gateway:8085"
        volumes:
            - ./logs:/app/logs
        networks:
            - dominium-network

networks:
    dominium-network:
        driver: bridge
