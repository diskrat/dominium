version: "3.8"

services:
    # Message Broker Infrastructure
    zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0
        container_name: dominium-zookeeper
        ports:
            - "2181:2181"
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        healthcheck:
            test: ["CMD", "nc", "-z", "localhost", "2181"]
            interval: 10s
            timeout: 5s
            retries: 5

    kafka:
        image: confluentinc/cp-kafka:7.4.0
        container_name: dominium-kafka
        depends_on:
            zookeeper:
                condition: service_healthy
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        healthcheck:
            test:
                [
                    "CMD",
                    "kafka-broker-api-versions.sh",
                    "--bootstrap-server=localhost:9092",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    # Blockchain Nodes (Mining)
    node-1:
        build:
            context: .
            dockerfile: Dockerfile.node
        container_name: dominium-node-1
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            NODE_ID: node-1
            P2P_BROKERS: kafka:9092
            MINE: "true"
            DIFFICULTY: "4"
        volumes:
            - ./logs:/app/logs
        networks:
            - dominium-network

    node-2:
        build:
            context: .
            dockerfile: Dockerfile.node
        container_name: dominium-node-2
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            NODE_ID: node-2
            P2P_BROKERS: kafka:9092
            MINE: "true"
            DIFFICULTY: "4"
        volumes:
            - ./logs:/app/logs
        networks:
            - dominium-network

    node-3:
        build:
            context: .
            dockerfile: Dockerfile.node
        container_name: dominium-node-3
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            NODE_ID: node-3
            P2P_BROKERS: kafka:9092
            MINE: "true"
            DIFFICULTY: "4"
        volumes:
            - ./logs:/app/logs
        networks:
            - dominium-network

    # API Gateway
    api-gateway:
        build:
            context: .
            dockerfile: Dockerfile.api
        container_name: dominium-api-gateway
        depends_on:
            kafka:
                condition: service_healthy
            node-1:
                condition: service_started
        ports:
            - "8085:8085"
        environment:
            API_PORT: "8085"
            API_ID: "api-gateway"
            P2P_BROKERS: "kafka:9092"
            ADMIN_KEY: "${ADMIN_PRIVATE_KEY}"
            ADMIN_PUB: "${ADMIN_PUBLIC_KEY}"
        volumes:
            - ./logs:/app/logs
        networks:
            - dominium-network

    # Web Visualizer
    visualizer:
        build:
            context: .
            dockerfile: Dockerfile.visualizer
        container_name: dominium-visualizer
        depends_on:
            api-gateway:
                condition: service_started
        ports:
            - "8080:8080"
        environment:
            API_URL: "http://api-gateway:8085"
        volumes:
            - ./logs:/app/logs
        networks:
            - dominium-network

networks:
    dominium-network:
        driver: bridge
